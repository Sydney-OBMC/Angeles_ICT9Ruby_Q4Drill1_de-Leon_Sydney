<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q4 Drill 1</title>
  <style>
    body{
        font-family: Arial;
        background: #cfcfcf;
        text-align: center;
        padding: 50px;
    }

    .box{
        background: #1f2530;
        color: white;
        padding: 20px;
        border-radius: 25px;
        width: 500px;
        margin: auto;
    }

    input{
        padding: 8px;
        width: 150px;
        border-radius: 5px;
        border: none;
    }

    button{
        padding: 8px 12px;
        background: #f4c542;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .error{
        color: red;
        margin-top: 10px;
    }

    .title{
        background-color: rgb(8, 6, 21);
        height: 100px;
        border-radius: 25px;
    }

    .title{
        color: white;
    }

  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">
</head>
<body>
    <div class="title">
        <h2 style="text-align: center; padding-top: 25px;">Electricity Consumption Classifier</h2>
    </div>
    
    <br>
    <br>

    <div class="box">
        <h3>kWh</h3>
        <input type="number" id="kWhInput" placeholder="Input kWh">
        <button onclick="classify()">Consumption Classification</button>

        <p id="errorMsg" class="error"></p>
    </div>

    <script>
        function classify() {
            var kwh= (document.getElementById("kWhInput").value);
            var error= document.getElementById("errorMsg");

            error.innerHTML = "";

            if (kwh < 0){
                error.innerHTML = "Please input a non-negative number.";
            } else if (kwh >= 0 && kwh <=100) {
                alert("Lifeline Consumer: Discounted electricity rates");
            } else if (kwh <=200) {
                alert("Low Consumption: Normal residential rate");
            } else if (kwh <=300) {
                alert("Average Consumption: Typical electricity usage");
            } else if (kwh <=500) {
                alert("High Consumption: Higher electricity usage");
            } else {
                alert("Very High Consumption: Heavy electricity users");
            }
        }
    </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js "></script>
</body>
</html>
